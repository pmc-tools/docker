name: Test UMB

on:
  schedule:
    - cron: '26 8 * * *'
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # to trigger the workflow manually
  workflow_dispatch:


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ruff
        run: |
          pip install ruff
          ruff check umbtest tests main.py

      - name: Run pyright
        run: |
          pip install pyright
          pyright

      - name: Check notebook/markdown pair is in sync
        run: |
          pip install jupytext
          python - <<'PY'
          import json

          import jupytext
          import nbformat

          def cells(path):
              nb = nbformat.from_dict(jupytext.read(path))
              for c in nb.cells:
                  c.execution_count = None
                  c.metadata = {}
              d = json.loads(nbformat.writes(nb))["cells"]
              for c in d:
                  c.pop("id", None)
                  if c.get("outputs") == []:
                      c.pop("outputs", None)
              return d

          expected = cells("getting_started.md")
          actual = cells("getting_started.ipynb")
          assert expected == actual, (
              "getting_started.md and getting_started.ipynb differ; "
              "run: jupytext --sync getting_started.md"
          )
          PY

  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          # Set defaults
          - runs-on: ubuntu-latest
            platform: linux/amd64
          - runs-on: ubuntu-24.04-arm
            platform: linux/arm64
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -  name: Build from Dockerfile
         run: docker build -t pmctools/umbi:ci .

      - name: Run Docker
        run: docker run -d -it --name ci pmctools/umbi:ci

      - name: Run tests
        run: docker exec ci bash -c "cd /opt/umb; UMB_TEST_MODELS=full python -m pytest --junit-xml=test-results.xml tests"

      - name: Download test results
        if: always()
        run: docker cp ci:/opt/umb/test-results.xml test-results.xml

      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          # A list of JUnit XML files, directories containing the former, and wildcard
          # patterns to process.
          # See @actions/glob for supported patterns.
          path: test-results.xml

          # (Optional) Add a summary of the results at the top of the report
          summary: true

          # (Optional) Select which results should be included in the report.
          # Follows the same syntax as `pytest -r`
          display-options: fEX

          # (Optional) Fail the workflow if no JUnit XML was found.
          fail-on-empty: true

          # (Optional) Title of the test results section in the workflow summary
          title: Test results
